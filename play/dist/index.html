o preparar o SRVCC é inferida a partir do que o UE envia e recebe."}]},{"id":"desafio-6","title":"Chamada de emergência (112) em 5G SA","description":"Investigue por que o Polaris leva quase o dobro do tempo do Equinox para completar o 112 a partir de 5G SA, embora os dois recebam a mesma resposta da rede. Compare com o controle em 4G e avalie se a sequência de tentativas respeita a hierarquia de seleção de rede.","sideInfo":[{"label":"HPLMN","value":"Zenith · 724/078 · n78 PCI 88 + B3 PCI 220"},{"label":"Outra operadora na área","value":"Aurora · 724/023 · B3 PCI 145 + 2G"},{"label":"Indicador","value":"Discagem do 112 → chamada estabelecida"}],"num":6,"scenarios":[{"id":"cen2-cdut","label":"Equinox · 112 em 5G SA","title":"Fica na própria operadora: VoLTE de emergência","status":"Referência aprovada · 3/3","statusClass":"good","device":"Equinox / CDUT","desc":"Equinox · 112 discado em 5G SA, mesma célula do cenário 1 · três repetições","rat":"NR → LTE","metrics":[{"label":"Tempo de estabelecimento","value":"1,88–2,05 s","note":"3/3 · média 1,96 s","tone":"good-text","observation":"Discagem até estabelecimento: 1,88–2,05 s","evidence":"context"},{"label":"Célula escolhida após a falha","value":"Zenith · 724/078","note":"LTE PCI 220 · mesma operadora, mesmo site","tone":"good-text","observation":"LTE selecionada: Zenith 724/078 · PCI 220","evidence":"context"},{"label":"Domínio final","value":"IMS (VoLTE) · Zenith","note":"urn:service:sos · APN sos","tone":"good-text","observation":"Estabelecimento via IMS · VoLTE · APN sos","evidence":"context"},{"label":"Resposta da rede em 5G","value":"5GMM cause 90","note":"sem EPS Fallback · igual no DUT","tone":"warn-text","observation":"DL NAS Transport: 5GMM cause 90 · sem redirecionamento","evidence":"context"}],"notice":"Log com as três repetições do cenário 2. O CDUT mostra o comportamento esperado diante da mesma falha de rede: outra RAT da HPLMN antes de qualquer outra operadora."},{"id":"cen1-dut","label":"Polaris · 11 do Aurora em 5G SA em outro site","Repetir as trocas só no Boreal, em 5G SA","Medir RSRP e RSRQ das células durante as trocas"],explain:"Só o mesmo aparelho em outra RAT isola o 5G SA. As outras opções isolam o site, o aparelho ou o RF."}],report:[{q:"Qual é a causa raiz mais provável?",options:["O Aurora mantém a identidade do perfil antigo (SUCI 724/085) após a troca","O perfil Zenith do Aurora ainda não estava provisionado no UDM","O IMEI do Aurora não está liberado na rede da Zenith","A célula Zenith PCI 201 restringe o acesso de novos assinantes"],explain:"Na 2ª tentativa a célula anuncia 724/078, mas o SUCI ainda traz 724/085; na 3ª o SUCI muda e o registro é aceito. A identidade nova foi aceita assim que apareceu (não é provisionamento); IMEI bloqueado daria outra causa e falharia também na 3ª; a célula não está barrada e aceita o Boreal."},{q:"O que descarta um problema de rede ou de cobertura?",options:["O Boreal registra de primeira no mesmo PLMN/PCI e o Aurora registra de primeira em LTE","As duas rejeições vêm do AMF, e não do RRC","O RSRP da Zenith fica só 3 dB abaixo do da Vantis","A troca Zenith → Nimbus também exige três tentativas"],explain:"O CDUT na mesma célula e o controle LTE afastam rede e site. Rejeições NAS mostram onde a falha aparece, não quem a causa; o RSRP sozinho não descarta a rede; o cenário Nimbus repete o sintoma, mas não tem CDUT."},{q:"Qual é a sequência de rejeições NAS observada?",options:["#3 Illegal UE → #11 PLMN not allowed → Accept","#11 PLMN not allowed → #3 Illegal UE → Accept","#3 Illegal UE → #3 Illegal UE → Accept","#7 5GS services not allowed → #11 → Accept"],explain:"Tentativa 1: 5GMM #3; tentativa 2: #11; tentativa 3: Registration Accept."},{q:"Severidade do issue",options:["Alta: 5/5 trocas precisam de 3 tentativas, contra 1 no CDUT","Baixa: o aparelho acaba registrando em menos de 5 s","Média: afeta só o 5G SA, o LTE funciona","Sem issue: rejeições após troca de perfil são esperadas"],explain:"É sistemático (100%), afeta duas operadoras e o tempo de registro sobe de ~1 s para ~4,6 s.",field:"severity"}],title:"Cascata de rejeições NAS e registro 5G SA só na 3ª tentativa: Aurora após troca de perfil Vantis → Zenith",impact:"Bloqueia a homologação do Aurora: cada troca de operadora em 5G SA custa duas rejeições NAS e cerca de 3,5 s a mais."},"desafio-3":{short:"Handover inter-frequência",icon:"📶",brief:"Clientes do Meridian perdem a conexão ao se deslocar entre as bandas n78 e n41. Monte o teste de mobilidade e descubra onde está o atraso.",equipment:{required:["modemlog","cdut","route"],neutral:["gps","spectrum"]},setup:[{q:"Qual é a célula serving do teste?",options:["n78 · PCI 88","n41 · PCI 145","Band 3 · PCI 41","n78 · PCI 201"],explain:"O UE começa em n78 PCI 88 (NR-ARFCN 633180)."},{q:"Qual é o alvo inter-frequência?",options:["n41 · PCI 145 / 160","n78 · PCI 101","Band 3 · PCI 220","GERAN 900 · ARFCN 62"],explain:"Inter-frequência = outra banda: n41 PCI 145/160. PCI 101 em n78 é intra-frequência."},{q:"Qual cenário de controle você inclui?",options:["Handover intra-frequência n78 PCI 88 → PCI 101","Teste de velocidade de download parado","Chamada de voz em 2G","Reboot do aparelho em loop"],explain:"O controle intra-frequência mostra se o DUT falha em qualquer mobilidade ou só na inter-frequência."}],report:[{q:"Qual é a causa raiz mais provável?",options:["O Meridian atrasa o Measurement Report A5 (~3,7 s contra ~0,7 s no CDUT) e sofre RLF por t310 antes do handover","A rede configurou um TTT diferente para o Meridian","A célula n41 está fora do ar","O Meridian não suporta a banda n78"],explain:"Mesmo TTT de 240 ms; o CDUT reporta em ~0,7 s e completa o HO. O DUT demora ~3,7 s e entra em RLF."},{q:"O que localiza o defeito no comportamento inter-frequência do DUT?",options:["O próprio Meridian conclui o HO intra-frequência e o Solstice conclui o inter-frequência sem RLF","O RLF acontece por t310-Expiry","Foram três repetições","O log é do UE"],explain:"O controle intra do DUT e a referência inter do CDUT isolam o caminho inter-frequência do Meridian."},{q:"O que acontece depois do RLF?",options:["6 × Msg1 sem resposta na PCI 88; reestabelece na PCI 145","Reestabelece de primeira na PCI 88","O aparelho reinicia","Cai para 2G"],explain:"A PCI 88 é inelegível (critério S reprovado); o UE tenta a PCI 145 e reestabelece em ~4,1 s."},{q:"Severidade do issue",options:["Alta: perda de continuidade em 3/3 repetições","Baixa: a conexão volta sozinha","Média: só em uma banda","Sem issue"],explain:"Perda de conexão sistemática na mobilidade, com recuperação lenta.",field:"severity"}],title:"RLF por atraso no handover inter-frequência e acesso em célula inelegível: Meridian 5G SA"},"desafio-4":{short:"IMS · VoNR / VoLTE",icon:"☎️",brief:"O Vanguard não recebe chamadas em VoNR e, em VoLTE, a voz chega ininteligível. Prepare a bancada de voz e descubra se há uma causa ou duas.",equipment:{required:["modemlog","cdut","ims","remote","audio"],neutral:[]},setup:[{q:"Como você monta o TC#1 (falha de chamada MT)?",options:["5G SA n78 PCI 88 · toggle de modo avião + chamada MT em VoNR","5G SA n78 PCI 88 · power cycle + chamada MT em VoNR","LTE Band 3 PCI 41 · toggle de modo avião + chamada MO","5G SA n78 PCI 88 · chamada MO em VoNR sem reiniciar o IMS"],explain:"O TC#1 reinicia o cliente IMS por modo avião e recebe uma chamada MT em VoNR. Trocar o toggle por power cycle muda o gatilho do defeito."},{q:"Como você monta o TC#2 (voz ininteligível)?",options:["LTE Band 3 EARFCN 1575 PCI 41 · power cycle + chamada MO em VoLTE","LTE Band 3 PCI 41 · toggle de modo avião + chamada MT em VoLTE","5G SA n78 PCI 88 · power cycle + chamada MO em VoNR","LTE Band 3 PCI 41 · power cycle + chamada MO só com AMR-WB"],explain:"O TC#2 é uma chamada MO em VoLTE, com o DUT como ofertante do SDP, após power cycle."},{q:"Qual autenticação o núcleo IMS da bancada usa?",options:["SIP Digest MD5 · ims.novalink.com.br","IMS-AKA com IPsec · ims.novalink.com.br","SIP Digest MD5 sem qop · outro realm","Autenticação só pelo NAS 5G, sem desafio SIP"],explain:"A bancada usa SIP Digest MD5 com qop=auth no realm ims.novalink.com.br; na rede comercial seria IMS-AKA."}],report:[{q:"Quantas causas explicam os sintomas?",options:["Duas causas independentes no mesmo cliente IMS","Uma única causa no cliente IMS, que afeta registro e mídia","Uma única causa no núcleo IMS da NovaLink","Uma causa no DUT (registro) e outra no terminal remoto (voz)"],explain:"O registro só falha com o cache de nonce (modo avião); a voz falha mesmo após power cycle, com registro OK. São mecanismos diferentes que só dividem o cliente IMS."},{q:"Por que o registro IMS do TC#1 é rejeitado?",options:["O DUT responde ao 401 com um nonce em cache e recebe 403 por nonce divergente","O nonce expira porque o REGISTER autenticado demora demais","A identidade privada IMS no SIM do DUT está errada","O realm da Authorization não bate com o do 401"],explain:"Warning 399: o nonce não bate com o desafio mais recente. O mesmo SIM registra de primeira após power cycle, o que afasta identidade e senha; o REGISTER sai em ~35 ms."},{q:"Por que a voz do TC#2 é ininteligível?",options:["A resposta escolhe só AMR (PT 97), mas o DUT continua codificando EVS no PT 97","A rede escolhe AMR-NB e a banda estreita deixa a voz ininteligível","O bearer QCI 1 tem GBR baixo demais para EVS 24,4 kbps","Há perda de RTP no enlace de rádio por causa do RSRP de −84 dBm"],explain:"O RTP flui (RX 497–499) e o CDUT tem voz nítida em AMR-NB. O problema é o codec: o DUT usa EVS enquanto o negociado é AMR."},{q:"Severidade do issue",options:["Alta: dois defeitos em 3/3, sem voz em 5G SA e áudio inutilizável em VoLTE","Média: só ocorre depois de usar o modo avião","Média: a chamada MO completa sem erro SIP","Baixa: o registro volta após reiniciar o aparelho"],explain:"Perda total do serviço de voz MT em 5G SA e chamadas VoLTE sem áudio utilizável.",field:"severity"}],title:"Vanguard: registro IMS rejeitado após modo avião
